name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The voucher format is exact to the last integer: u64 nonces and i128
        # amounts both run past what a JS number can hold. Run every supported
        # Node, because a BigInt or JSON change here is a wrong signature.
        node: ['20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  portable:
    runs-on: ubuntu-latest
    name: the offline half runs in a browser
    steps:
      - uses: actions/checkout@v5
      # The phone that signs a voucher with no signal is the whole point, and a
      # browser has neither Buffer nor node:crypto. Catching this here is the
      # difference between a library that works on a phone and one that only
      # looks like it does.
      - name: src imports no Node built-ins
        run: |
          if grep -rnE "(from|require\()[[:space:]]*['\"]node:" src/; then
            echo "::error::src/ imports a Node built-in; the offline half must run in a browser"
            exit 1
          fi
          echo "no node: imports"
      - name: src does not use Buffer
        run: |
          if grep -rnE "Buffer[.(]|new[[:space:]]+Buffer" src/; then
            echo "::error::src/ uses Buffer, which does not exist in a browser"
            exit 1
          fi
          echo "no Buffer"

  shape:
    runs-on: ubuntu-latest
    name: package shape
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # The published tarball must carry the source and nothing else.
      - name: npm pack contains the source and nothing else
        run: |
          npm pack --silent >/dev/null
          tar tzf ./*.tgz
          tar tzf ./*.tgz | grep -qE '^package/src/index\.js$'
          tar tzf ./*.tgz | grep -qE '^package/src/chain\.js$'
          tar tzf ./*.tgz | grep -qE '^package/src/anchor\.js$'
          ! tar tzf ./*.tgz | grep -qE '^package/(test|node_modules)/'
      # Every subpath in "exports" must resolve, on a real install, from a
      # directory that is not this one. A typo here is invisible until someone
      # installs the package and it is not this repo's tests that catch it.
      - name: every declared export resolves
        run: |
          npm pack --silent >/dev/null
          mkdir -p /tmp/shape && cd /tmp/shape
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz >/dev/null
          node --input-type=module -e "
            const subpaths = ['@lastmile/sdk', '@lastmile/sdk/chain', '@lastmile/sdk/bytes', '@lastmile/sdk/anchor'];
            for (const s of subpaths) {
              const m = await import(s);
              if (!Object.keys(m).length) throw new Error(s + ' exports nothing');
              console.log(s, '->', Object.keys(m).length, 'exports');
            }
          "
